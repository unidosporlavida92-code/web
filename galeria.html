  <style>
    :root{
      --gap:16px;
      --radius:12px;
      --bg:#0f241c;
      --card:#0b201b;
      --accent:#06b6d4;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: 'Poppins', system-ui, sans-serif;
      background:linear-gradient(180deg,#095548 0%, #04121a 100%);
      color:#e6eef6;
      padding:32px;
    }

    h1{margin:0 0 18px;font-size:clamp(18px,3vw,28px)}
    p.lead{margin:0 0 24px;color:#b8d7e0}

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:var(--gap);
      align-items:stretch;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      border-radius:var(--radius);
      overflow:hidden;
      position:relative;
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
    }

    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 14px 30px rgba(2,6,23,0.7);
    }

    .card img{width:100%;height:180px;object-fit:cover;display:block}
    .caption{padding:10px 12px;font-size:14px;color:#d9eef7;text-align:center}

    /* Modal / lightbox */
    .lightbox{
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      background:rgba(2,6,23,0.78);
      backdrop-filter:blur(6px);
      opacity:0;visibility:hidden;
      transition:opacity .18s ease, visibility .18s;
      z-index:60;
    }
    .lightbox.open{opacity:1;visibility:visible}

    .lightbox-content{
      max-width:1100px;width:100%;max-height:92vh;
      border-radius:12px;overflow:hidden;
      display:flex;flex-direction:column;
      background:linear-gradient(180deg,#071427,#02121a);
    }
    .lightbox-media{display:flex;align-items:center;justify-content:center;background:#04111a;padding:18px}
    .lightbox-media img{max-width:100%;max-height:78vh;display:block;border-radius:6px}

    .lightbox-info{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#cfeff6}
    .lightbox .close, .lightbox .nav{background:none;border:0;color:inherit;font-size:18px;padding:8px;border-radius:8px;cursor:pointer}
    .lightbox .close:hover, .lightbox .nav:hover{background:rgba(255,255,255,0.03)}

    .controls{display:flex;gap:8px;align-items:center}

   
    .boton-regresar {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: var(--verde);
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.3s, transform 0.3s;
      z-index: 1000;
    }

    .boton-regresar:hover {
      background-color: #2ecc71;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .animal {
        flex-direction: column;
      }
      .animal img {
        width: 100%;
        height: 220px;
      }
    }
  </style>
</head>

  <script>
    (function(){
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const caption = document.getElementById('lightboxCaption');
      const closeBtn = document.getElementById('closeBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      const cards = Array.from(gallery.querySelectorAll('.card'));
      const images = cards.map(c => {
        const img = c.querySelector('img');
        return {src: img.src, alt: img.alt, caption: c.querySelector('.caption').textContent};
      });

      let current = 0;

      function open(index){
        const item = images[index];
        current = index;
        lightboxImg.src = item.src;
        lightboxImg.alt = item.alt;
        caption.textContent = item.caption;
        lightbox.classList.add('open');
        closeBtn.focus();
      }

      function close(){
        lightbox.classList.remove('open');
        lightboxImg.src = '';
        lightboxImg.alt = '';
      }

      function showNext(delta){
        current = (current + delta + images.length) % images.length;
        const it = images[current];
        lightboxImg.style.opacity = 0;
        setTimeout(()=>{
          lightboxImg.src = it.src;
          lightboxImg.alt = it.alt;
          caption.textContent = it.caption;
          lightboxImg.style.opacity = 1;
        },150);
      }

      cards.forEach((card, idx)=>{
        card.addEventListener('click', ()=> open(idx));
        card.addEventListener('keydown', e=>{
          if(e.key==='Enter' || e.key===' ') {e.preventDefault(); open(idx);}
        });
      });

      closeBtn.addEventListener('click', close);
      prevBtn.addEventListener('click', ()=> showNext(-1));
      nextBtn.addEventListener('click', ()=> showNext(1));
      lightbox.addEventListener('click', e=>{if(e.target===lightbox) close();});

      document.addEventListener('keydown', e=>{
        if(lightbox.classList.contains('open')){
          if(e.key==='Escape') close();
          if(e.key==='ArrowLeft') showNext(-1);
          if(e.key==='ArrowRight') showNext(1);
        }
      });
    })();
  </script>
